services:
  postgres:
    image: postgres:17-alpine
    container_name: workscale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: workscale
      POSTGRES_PASSWORD: workscale_dev_password
      POSTGRES_DB: workscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workscale -d workscale"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workscale-app
    restart: unless-stopped
    ports:
      - "3500:3500"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://workscale:workscale_dev_password@postgres:5432/workscale
      PORT: 3500
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: